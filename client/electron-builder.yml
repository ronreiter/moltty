appId: com.moltty.app
productName: Moltty
directories:
  buildResources: resources
  output: release
mac:
  target: dmg
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  notarize: true
  protocols:
    - name: Moltty Auth
      schemes:
        - moltty
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
