version: '3'

tasks:
  default:
    silent: true
    cmds:
      - task --list

  install:
    desc: Install npm dependencies
    dir: client
    cmds:
      - npm install
    sources:
      - package.json
      - package-lock.json

  dev:
    desc: Start dev server
    deps: [install]
    dir: client
    cmds:
      - npm run dev

  build:
    desc: Build the app
    deps: [install]
    dir: client
    cmds:
      - npm run build

  test:
    desc: Run Playwright tests
    deps: [install]
    dir: client
    cmds:
      - npx playwright test

  package:
    desc: Package the app for distribution
    deps: [build]
    dir: client
    env:
      APPLE_API_KEY_ID: 2ZR5277S92
      APPLE_API_ISSUER: afb89f06-eb3e-4054-a8a4-fc134c6ae859
      APPLE_API_KEY: "{{.HOME}}/private_keys/AuthKey_2ZR5277S92.p8"
      APPLE_TEAM_ID: 8BKF8DY7Y4
    cmds:
      - npm run package

  release:
    desc: Create a GitHub release
    deps: [package]
    cmds:
      - gh release create v{{.VERSION}} --title "Moltty v{{.VERSION}}" --generate-notes client/release/Moltty-{{.VERSION}}-arm64.dmg
    vars:
      VERSION:
        sh: node -p "require('./client/package.json').version"

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf client/dist client/out client/release
