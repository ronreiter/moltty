version: '3'

tasks:
  default:
    deps: [build]

  install:
    dir: client
    cmds:
      - npm install
    sources:
      - package.json
      - package-lock.json

  dev:
    deps: [install]
    dir: client
    cmds:
      - npm run dev

  build:
    deps: [install]
    dir: client
    cmds:
      - npm run build

  test:
    deps: [install]
    dir: client
    cmds:
      - npx playwright test

  package:
    deps: [build]
    dir: client
    cmds:
      - npm run package

  release:
    deps: [package]
    cmds:
      - gh release create v{{.VERSION}} --title "Moltty v{{.VERSION}}" --generate-notes client/release/Moltty-{{.VERSION}}-arm64.dmg
    vars:
      VERSION:
        sh: node -p "require('./client/package.json').version"

  clean:
    cmds:
      - rm -rf client/dist client/out client/release
